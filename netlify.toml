[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Server mode: pages are rendered by a Netlify Function and cached on Netlify's CDN until a
  # Sanity publish purges them (README → "Two build modes"). Same for every deploy context.
  # Secrets (SANITY_API_READ_TOKEN, SANITY_PREVIEW_SECRET, SANITY_REVALIDATE_SECRET) are NOT here:
  # set them in the Netlify UI.
  SANITY_VISUAL_EDITING = "true"

# Headers: there are none here on purpose. Netlify doesn't apply netlify.toml headers to
# server-rendered pages, so dist/_headers covers the static files (src/preview/integration.mjs)
# and src/preview/middleware.ts sets security + cache headers on every rendered page.
